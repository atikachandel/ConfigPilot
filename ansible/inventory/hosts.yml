# ConfigPilot inventory.
#
# In a real deployment each host below would be a router/switch/firewall
# reachable over SSH/NETCONF (see roles/deploy_config for where to plug in
# netmiko/napalm/ansible network modules). For local development and CI,
# every group targets `localhost` and "deploying" means writing the
# rendered config into mock_devices/<env>/, which stands in for the
# device's running-config store so the whole pipeline is runnable without
# real hardware.
all:
  children:
    dev:
      hosts:
        dev-device:
          ansible_connection: local
          mock_device_dir: "{{ playbook_dir }}/../../mock_devices/dev"
    staging:
      hosts:
        staging-device:
          ansible_connection: local
          mock_device_dir: "{{ playbook_dir }}/../../mock_devices/staging"
    prod:
      hosts:
        prod-device:
          ansible_connection: local
          mock_device_dir: "{{ playbook_dir }}/../../mock_devices/prod"
